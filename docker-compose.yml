# Full stack: PostgreSQL + MinIO (S3) + API + worker + web.
#   cp .env.example .env   # set SESSION_SECRET / STORAGE_SIGNING_SECRET (and provider keys later)
#   docker compose up --build
# Web: http://localhost:3000 · MinIO console: http://localhost:9001
name: framecraft

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgres://framecraft:framecraft@db:5432/framecraft
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  # Browsers fetch media via presigned URLs, so they must use a host-reachable endpoint.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: framecraft-media
  S3_ACCESS_KEY_ID: framecraft
  S3_SECRET_ACCESS_KEY: framecraft-minio-secret
  S3_FORCE_PATH_STYLE: "true"
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
  # Local compose is not an internet-facing deployment: allow plain-HTTP cookies.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  EMBEDDED_WORKER: "false"
  HOST: 0.0.0.0
  # Production mode never renders fixtures; without provider keys generation reports "configuration required".
  DEV_FIXTURES_ENABLED: "false"
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: framecraft
      POSTGRES_PASSWORD: framecraft
      POSTGRES_DB: framecraft
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framecraft"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: framecraft
      MINIO_ROOT_PASSWORD: framecraft-minio-secret
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 framecraft framecraft-minio-secret &&
             mc mb --ignore-existing local/framecraft-media"

  migrate:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: [.env]
    environment: *server-env
    command: ["node", "dist/migrate.js"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: [.env]
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  worker:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: [.env]
    environment: *server-env
    command: ["node", "dist/worker-main.js"]
    depends_on: { api: { condition: service_healthy } }
    deploy: { replicas: 1 }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_ORIGIN: http://api:4000 }
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  miniodata:
